[package]
name = "team-principal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sim racing launcher and display manager"

[lib]
name = "team_principal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tp-model = { workspace = true }
tp-geometry = { workspace = true }
tp-edid = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }
# Encoding a game's own icon as cover art. Already in the tree as a transitive
# dependency of tauri, so this costs nothing to compile; naming it directly is
# what makes it legal to `use`.
png = { version = "0.17", default-features = false }
# native-tls rather than the default rustls: on Windows that is SChannel, the
# operating system's own TLS. It uses the Windows trust store — so a corporate
# root, or one Windows Update has revoked, is honoured without this app keeping
# its own opinion about certificate authorities. It also keeps `ring` out of the
# tree, which needs a C compiler and breaks the Linux cross-check CI runs.
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = [
    "native-tls",
] }
# The Voice Lab fetches uv from its GitHub release and checks its SHA-256
# before running it, and talks to the local service over HTTP. Both crates are
# already in the tree as updater dependencies, so naming them costs nothing to
# compile; naming them is what makes it legal to `use` them. `native-tls` for
# the same reason as above.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
sha2 = "0.10"

# Win32. Only compiled on Windows; every call site is behind a provider trait
# so the rest of the app is testable without it.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi",
    # Enumerating display adapters for the Voice Lab's GPU check: name, vendor
    # and video memory, without a third-party tool or a WMI query.
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    # BCryptGenRandom, for the Voice Lab service's per-session token.
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# Tauri's default; keeps `cargo test` from needing a display server.
custom-protocol = ["tauri/custom-protocol"]
