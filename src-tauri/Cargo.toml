[package]
name = "team-principal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sim racing launcher and display manager"

[lib]
name = "team_principal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tp-model = { workspace = true }
tp-geometry = { workspace = true }
tp-edid = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }
# native-tls rather than the default rustls: on Windows that is SChannel, the
# operating system's own TLS. It uses the Windows trust store — so a corporate
# root, or one Windows Update has revoked, is honoured without this app keeping
# its own opinion about certificate authorities. It also keeps `ring` out of the
# tree, which needs a C compiler and breaks the Linux cross-check CI runs.
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = [
    "native-tls",
] }

# Win32. Only compiled on Windows; every call site is behind a provider trait
# so the rest of the app is testable without it.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# Tauri's default; keeps `cargo test` from needing a display server.
custom-protocol = ["tauri/custom-protocol"]
