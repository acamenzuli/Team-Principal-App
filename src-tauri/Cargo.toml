[package]
name = "team-principal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sim racing launcher and display manager"

[lib]
name = "team_principal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tp-model = { workspace = true }
tp-geometry = { workspace = true }
tp-edid = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"

# Win32. Only compiled on Windows; every call site is behind a provider trait
# so the rest of the app is testable without it.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# Tauri's default; keeps `cargo test` from needing a display server.
custom-protocol = ["tauri/custom-protocol"]
