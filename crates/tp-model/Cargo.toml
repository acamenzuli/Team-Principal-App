[package]
name = "tp-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Deliberately depends on NOTHING platform-specific. No `windows`, no `tauri`.
# This crate is the IPC contract; keeping it free of those makes the TypeScript
# generator a fast standalone build and keeps the types testable everywhere.
[dependencies]
serde = { workspace = true }
# For the embedded adapter catalog, which is JSON so that adding a title is
# data rather than a code change — and so a corrected entry can be sent to a
# user as a file rather than a release.
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
ts-rs = { version = "10", features = ["serde-compat", "uuid-impl"] }

[dev-dependencies]
