[package]
name = "tp-fakegame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# A stand-in for a real sim, used to test the window watchdog without owning
# every game. It opens a window, waits, then moves and resizes itself — which
# is exactly the behaviour that makes sims fight a window manager.
[dependencies]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]
