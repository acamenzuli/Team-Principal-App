[package]
name = "tp-geometry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# THE CORE. Pure math over a rig description.
#
# Note what is absent: no `windows`, no `tauri`, no game adapters. That is not
# a convention, it is enforced here — this crate physically cannot call Win32
# or know anything about a specific title. Adapters consume its output; they
# never do their own trigonometry.
[dependencies]
tp-model = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
ts-rs = { version = "10", features = ["serde-compat"] }

[dev-dependencies]
serde_json = { workspace = true }
