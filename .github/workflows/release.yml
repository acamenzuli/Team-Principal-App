name: Release

# Tag a version and this builds, signs and publishes it. Nothing else does —
# a release that can happen by accident is one that happens at the wrong time.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The version comes from the tag, not from a hand-edited file.
      #
      # An update is found by comparing versions, so a release built at the same
      # version as the build people are running is invisible to it — the check
      # succeeds, finds nothing newer, and reports "up to date". That is a
      # confusing way to lose an evening, and deriving the version from the tag
      # removes the chance of it.
      - name: Take the version from the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH."
            exit 1
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

          # The app reports CARGO_PKG_VERSION and the updater compares it.
          # `version.workspace = true` in src-tauri means the value lives in
          # the root manifest, scoped here to [workspace.package] so it cannot
          # touch a dependency version, and verified because a regex that
          # matches nothing fails silently.
          $toml = Get-Content Cargo.toml -Raw
          $toml = [regex]::Replace(
            $toml,
            '(?ms)(\[workspace\.package\][^\[]*?^version = ")[^"]*(")',
            ('${1}' + $version + '${2}')
          )
          Set-Content Cargo.toml $toml

          if ((Get-Content Cargo.toml -Raw) -notmatch [regex]::Escape('version = "' + $version + '"')) {
            Write-Error "The workspace version was not rewritten to $version."
            exit 1
          }
          Write-Host "Releasing $version"

      # createUpdaterArtifacts makes the build produce a signed update alongside
      # the installer — which means it *requires* the private key. Committing it
      # would break the ordinary CI build, which has no key and must not have
      # one; that build produces the installer people download for testing.
      #
      # The public key is not set here: it is committed in tauri.conf.json, so
      # every build — this one, CI's, and a local one — carries the same key and
      # can verify the same releases. See scripts/updater-key.mjs.
      # A real release follows `releases/latest`, not the test channel the
      # committed config points at. Switched here rather than committed,
      # because during development every build should check the one place
      # development builds are published — and that is the whole point of the
      # committed value.
      - name: Point at the stable channel and turn on updater artifacts
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.plugins.updater.endpoints =
            @("https://github.com/${{ github.repository }}/releases/latest/download/latest.json")
          if (-not $config.plugins.updater.pubkey -or
              $config.plugins.updater.pubkey -eq "UNCONFIGURED") {
            Write-Error "No updater public key in tauri.conf.json. Run: node scripts/updater-key.mjs"
            exit 1
          }
          $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      # Refuse to publish an unsigned release rather than publish one nobody
      # can verify. A customer who installs an unsigned build can never be
      # updated to a signed one — the key is compiled in — so this failing
      # loudly now is far cheaper than discovering it later.
      - name: Refuse to release without a signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "No TAURI_SIGNING_PRIVATE_KEY secret. See docs/RELEASING.md."
            exit 1
          }

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Team Principal ${{ github.ref_name }}
          releaseBody: |
            Installs over the top and keeps everything: rigs, profiles,
            peripherals, snapshots and backups all live in
            `%APPDATA%\Team Principal` and are not touched.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # The release is created as a draft on purpose — an installer nobody has
      # opened yet should not be in front of customers. But a draft is invisible
      # to the updater: `releases/latest` does not resolve to it, so every app
      # in the world will keep reporting "up to date" until it is published.
      # That is a quiet failure, so it gets the loudest notice available here.
      - name: Say what is left to do
        shell: pwsh
        run: |
          @(
            "## Draft release created",
            "",
            "**Nothing can update to it yet.** A draft is not ``releases/latest``,",
            "so every installed copy will go on reporting *Up to date* until you",
            "open the release on GitHub and press **Publish release**.",
            "",
            "Install the ``.exe`` from the draft first and check it starts."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
