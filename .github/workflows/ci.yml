name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Everything that does not need a Windows runner. This is most of it, which is
  # the point of keeping tp-model and tp-geometry free of `windows` and `tauri`:
  # the core math and the whole IPC contract are checked in seconds on Linux.
  check:
    name: Lint, test, cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      # tauri-winres compiles the icon and manifest into a Windows resource
      # even for a cross-*check*, and needs llvm-rc to do it. Not preinstalled
      # on the ubuntu runner.
      - name: Install a Windows resource compiler
        run: sudo apt-get update && sudo apt-get install -y llvm

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Test the platform-neutral crates
        run: cargo test -p tp-model -p tp-geometry --all-targets

      # Type-checks the Win32 code without needing an MSVC linker, so a broken
      # `windows` call is caught here rather than on the Windows job minutes later.
      - name: Cross-check the Windows build
        run: cargo check --workspace --target x86_64-pc-windows-msvc --all-targets

      - name: Clippy
        run: cargo clippy --workspace --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      # `cargo test` regenerates src/bindings from the Rust types. If that
      # produces a diff, the committed TypeScript contract is stale.
      - name: TypeScript bindings are up to date
        run: |
          git diff --exit-code -- src/bindings \
            || { echo "::error::src/bindings is stale — run 'cargo test -p tp-model' and commit the result"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ts-rs covers payload types but knows nothing about command *names*, so
      # this closes the gap a rename would otherwise slip through.
      - name: IPC command surface matches the client
        run: node scripts/check-ipc.mjs

      - name: Frontend typecheck and build
        run: npm run build

  # The real thing. Only this job can link, run the DPI-awareness assertion, or
  # produce an installer.
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build

      # Includes the runtime assertion that the process really is Per-Monitor
      # V2 DPI aware, which only means anything on a real Windows process.
      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build the fake-game harness
        run: cargo build --release -p tp-fakegame

      # Produces both an NSIS installer and a portable exe. This is how the app
      # gets onto the rig without installing a Rust toolchain there: download
      # the artifact from this run's summary page.
      #
      # Unsigned until Azure Trusted Signing is set up, so SmartScreen will warn
      # on first launch. Expected — see the README.
      - name: Build installer and portable exe
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: team-principal-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: team-principal-portable
          path: target/release/TeamPrincipal.exe
          if-no-files-found: error

      - name: Upload fake-game harness
        uses: actions/upload-artifact@v4
        with:
          name: tp-fakegame
          path: target/release/tp-fakegame.exe
          if-no-files-found: error
