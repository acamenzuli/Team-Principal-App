name: CI

# The Linux checks run on every push: they take about two minutes and catch
# formatting, clippy, the platform-neutral tests, a stale IPC contract and a
# frontend that does not compile.
#
# The Windows job — the build, the installer, the test-channel release — does
# not. It takes nine minutes, and waiting nine minutes to find out what a local
# build tells you in one is the wrong loop. Ask for it when you want an
# installer: Actions -> CI -> Run workflow.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: "Build the Windows installer and publish the test channel"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Everything that does not need a Windows runner. This is most of it, which is
  # the point of keeping tp-model and tp-geometry free of `windows` and `tauri`:
  # the core math and the whole IPC contract are checked in seconds on Linux.
  check:
    name: Lint, test, cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      # tauri-winres compiles the icon and manifest into a Windows resource
      # even for a cross-*check*, and needs llvm-rc to do it. Not preinstalled
      # on the ubuntu runner.
      - name: Install a Windows resource compiler
        run: sudo apt-get update && sudo apt-get install -y llvm

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Test the platform-neutral crates
        run: cargo test -p tp-model -p tp-geometry --all-targets

      # Type-checks the Win32 code without needing an MSVC linker, so a broken
      # `windows` call is caught here rather than on the Windows job minutes later.
      - name: Cross-check the Windows build
        run: cargo check --workspace --target x86_64-pc-windows-msvc --all-targets

      - name: Clippy
        run: cargo clippy --workspace --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      # `cargo test` regenerates src/bindings from the Rust types. If that
      # produces a diff, the committed TypeScript contract is stale.
      - name: TypeScript bindings are up to date
        run: |
          git diff --exit-code -- src/bindings \
            || { echo "::error::src/bindings is stale — run 'cargo test -p tp-model' and commit the result"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ts-rs covers payload types but knows nothing about command *names*, so
      # this closes the gap a rename would otherwise slip through.
      - name: IPC command surface matches the client
        run: node scripts/check-ipc.mjs

      # The webview must be allowed to listen for events. Without that every
      # event in the app is dropped in silence, which is not something any
      # other check here would notice: the code compiles, the tests pass, and
      # the commands all work.
      - name: The webview can listen for events
        run: node scripts/check-capabilities.mjs

      - name: Frontend typecheck and build
        run: npm run build

  # The real thing. Only this job can link, run the DPI-awareness assertion, or
  # produce an installer.
  windows:
    name: Windows build
    # On request only. Everything it protects that can be checked without
    # Windows is checked above, in two minutes rather than nine; what is left
    # is the linked binary, the DPI assertion and the installer, and those are
    # wanted when somebody is about to install something.
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    # Needed to publish the test-channel release below. Nothing else in
    # this workflow writes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build

      # Includes the runtime assertion that the process really is Per-Monitor
      # V2 DPI aware, which only means anything on a real Windows process.
      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build the fake-game harness
        run: cargo build --release -p tp-fakegame

      # ----------------------------------------------------------- test channel
      #
      # Every push to the development branch publishes an installer the app can
      # update itself to, so testing a change does not mean downloading an
      # artifact and running an installer by hand each time.
      #
      # Two things have to line up for that, and neither is committed:
      #
      # * **A version newer than the last one.** The updater compares versions
      #   and offers nothing otherwise. The run number is monotonic, which is
      #   the only property needed of it.
      # * **Updater artifacts**, which make the build sign the installer. That
      #   needs the private key, so without the secret this step does nothing
      #   and the job carries on producing the plain artifact as before.
      #
      # The endpoint is *not* set here. It is committed, and it points at this
      # same release — so every build ever made, however it was built, checks
      # the one place builds are published. A build that points somewhere else
      # is a build that can never update, and working out which one you are
      # holding is not a thing anybody should have to do.
      - name: Prepare the test channel
        id: channel
        if: github.ref_name == 'claude/sim-racing-launcher-display-i60v81'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            "signing=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "::warning::No TAURI_SIGNING_PRIVATE_KEY secret, so this build cannot be signed and the app cannot update itself. See docs/RELEASING.md."
            # A warning annotation is easy to scroll past, and the job still
            # goes green, so the run looks like a success that quietly did half
            # the job. The summary is the one place that cannot be missed.
            @(
              "## No test-channel build",
              "",
              "``TAURI_SIGNING_PRIVATE_KEY`` was empty in this job, so the installer",
              "was not signed and no ``dev`` release was published. Installed copies",
              "of the app will go on reporting *nothing published yet*.",
              "",
              "Add it under **Settings -> Secrets and variables -> Actions ->",
              "Repository secrets**. Three things that look right and are not:",
              "",
              "* an **environment** secret - this job declares no environment, so it",
              "  cannot see one",
              "* a **variable** rather than a secret - different tab, same page",
              "* a name that does not match exactly, including case",
              "",
              "See ``docs/RELEASING.md``."
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $version = "0.1.${{ github.run_number }}"
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

          # The version the *app* reports is CARGO_PKG_VERSION, and the
          # updater compares that same number. src-tauri/Cargo.toml says
          # `version.workspace = true`, so the value lives in the root
          # manifest — rewriting src-tauri's matched nothing and every build
          # compiled as 0.1.0. That is not cosmetic: an update installs, the
          # app still reports the old version, and it offers the same update
          # forever.
          #
          # Scoped to the [workspace.package] block so it cannot touch a
          # dependency version, and verified afterwards, because a regex that
          # silently matches nothing is what caused this.
          $toml = Get-Content Cargo.toml -Raw
          $toml = [regex]::Replace(
            $toml,
            '(?ms)(\[workspace\.package\][^\[]*?^version = ")[^"]*(")',
            ('${1}' + $version + '${2}')
          )
          Set-Content Cargo.toml $toml

          if ((Get-Content Cargo.toml -Raw) -notmatch [regex]::Escape('version = "' + $version + '"')) {
            Write-Error "The workspace version was not rewritten to $version."
            exit 1
          }

          "signing=true" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Test build $version, updating from the dev channel"

      # Produces both an NSIS installer and a portable exe. This is how the app
      # gets onto the rig without installing a Rust toolchain there: download
      # the artifact from this run's summary page.
      #
      # Unsigned until Azure Trusted Signing is set up, so SmartScreen will warn
      # on first launch. Expected — see the README.
      - name: Build installer and portable exe
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      # The manifest the app fetches. Written here rather than by a release
      # action because the installer is already built above, and building it a
      # second time to obtain a JSON file would double the slowest job in the
      # repository.
      #
      # The installer is renamed to a fixed, space-free name: GitHub rewrites
      # spaces in asset names, and a URL assembled from a name containing them
      # is a download that 404s at the one moment nobody is watching.
      - name: Write the update manifest
        if: steps.channel.outputs.signing == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()

          New-Item -ItemType Directory -Force -Path channel | Out-Null
          Copy-Item $setup.FullName channel/TeamPrincipal-setup.exe

          $manifest = @{
            version = "${{ steps.channel.outputs.version }}"
            notes = "Test build. Rigs, profiles and backups are kept."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/download/dev/TeamPrincipal-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content channel/latest.json -Encoding utf8

      # One release, tagged `dev`, replaced in place. Marked a prerelease so it
      # can never be mistaken for a real one — and so `releases/latest`, the
      # stable channel every published build follows, keeps ignoring it.
      - name: Publish to the test channel
        if: steps.channel.outputs.signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Test channel
          body: |
            The newest development build, replaced on every push.

            Installed copies of Team Principal offer this automatically. Install
            it by hand once; after that the app updates itself to each new
            build.

            Not a release — the version numbers here are build numbers.
          prerelease: true
          files: |
            channel/TeamPrincipal-setup.exe
            channel/latest.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: team-principal-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: team-principal-portable
          path: target/release/TeamPrincipal.exe
          if-no-files-found: error

      - name: Upload fake-game harness
        uses: actions/upload-artifact@v4
        with:
          name: tp-fakegame
          path: target/release/tp-fakegame.exe
          if-no-files-found: error
