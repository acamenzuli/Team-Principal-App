[workspace]
resolver = "2"
members = ["crates/tp-model", "crates/tp-geometry", "crates/tp-edid", "crates/tp-fakegame", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "proprietary"
authors = ["Alex Camenzuli"]

[workspace.dependencies]
tp-model = { path = "crates/tp-model" }
tp-geometry = { path = "crates/tp-geometry" }
tp-edid = { path = "crates/tp-edid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
tracing = "0.1"
